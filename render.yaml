services:
  - type: web
    name: chep-occurrence-bot
    env: python
    buildCommand: "python -m pip install --upgrade pip setuptools wheel && python -m pip install greenlet --only-binary=:all: --no-cache-dir && python -m pip install -r requirements.txt --only-binary=:all: && playwright install chromium && playwright install-deps"
    startCommand: "gunicorn server:app --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
